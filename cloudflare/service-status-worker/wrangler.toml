name = "makakaiglitch-service-status"
main = "src/index.js"
compatibility_date = "2026-11-05"
workers_dev = true

[triggers]
crons = ["*/5 * * * *", "1-59/5 * * * *", "2-59/5 * * * *", "57 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "makakaiglitch-service-status"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[observability]
enabled = true

name: Update torrent swarm statistics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/torrent-stats.yml"
      - "scripts/update_torrent_stats.py"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torrent-swarm-stats
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify collector
        run: python3 scripts/update_torrent_stats.py --self-test

      - name: Collect swarm statistics
        run: python3 scripts/update_torrent_stats.py --output data/torrent-stats.json


      - name: Upload stats diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torrent-stats-${{ github.run_number }}
          path: data/torrent-stats.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/torrent-stats.json
          if git diff --cached --quiet; then
            echo "Torrent statistics did not change."
            exit 0
          fi
          git commit -m "chore: update torrent swarm statistics"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

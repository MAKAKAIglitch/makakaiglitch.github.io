name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "1-59/5 * * * *"
  workflow_run:
    workflows: ["Update torrent swarm statistics", "Update repository snapshot"]
    types: [completed]

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: service-status-pages-v2
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check JavaScript syntax
        run: |
          find assets/js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check torrent statistics collector
        run: python3 scripts/update_torrent_stats.py --self-test

      - name: Check repository snapshot collector
        run: python3 scripts/update_repositories.py --self-test

      - name: Test Service Status collector
        run: python3 scripts/service_status_monitor.py --self-test

      - name: Collect Service Status measurements
        run: python3 scripts/service_status_monitor.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload static website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .

      - name: Force-cancel the orphaned Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/42087198056/force-cancel" || true
          for attempt in $(seq 1 12); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/42087198056" --jq .status)
            if [ "$status" = "completed" ]; then
              echo "The orphaned Pages workflow run is completed."
              break
            fi
            echo "Waiting for orphaned Pages run to stop (attempt $attempt/12; status=$status)."
            sleep 5
          done
          if [ "$status" != "completed" ]; then
            echo "::error::The old Pages deployment is still active; refusing to start another deployment."
            exit 1
          fi

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1

name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "1-59/5 * * * *"
  workflow_run:
    workflows: ["Update torrent swarm statistics", "Update repository snapshot"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: service-status-pages-v2
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check JavaScript syntax
        run: |
          find assets/js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check torrent statistics collector
        run: python3 scripts/update_torrent_stats.py --self-test

      - name: Check repository snapshot collector
        run: python3 scripts/update_repositories.py --self-test

      - name: Test Service Status collector
        run: python3 scripts/service_status_monitor.py --self-test

      - name: Collect Service Status measurements
        run: python3 scripts/service_status_monitor.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload static website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .

      - name: Cancel the orphaned GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/c1f5e3542a0afa6d35c192be5b5e271150ac02e4/cancel"
          echo "Cancelled the stale GitHub Pages deployment."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1

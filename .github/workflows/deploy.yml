name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "1-59/5 * * * *"
  workflow_run:
    workflows: ["Update torrent swarm statistics", "Update repository snapshot"]
    types: [completed]

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: service-status-pages-v2
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check JavaScript syntax
        run: |
          find assets/js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check torrent statistics collector
        run: python3 scripts/update_torrent_stats.py --self-test

      - name: Check repository snapshot collector
        run: python3 scripts/update_repositories.py --self-test

      - name: Test Service Status collector
        run: python3 scripts/service_status_monitor.py --self-test

      - name: Collect Service Status measurements
        run: python3 scripts/service_status_monitor.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload static website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .

      - name: Release orphaned GitHub Pages and deployment records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stale_sha="c1f5e3542a0afa6d35c192be5b5e271150ac02e4"
          pages_deployment="repos/${GITHUB_REPOSITORY}/pages/deployments/${stale_sha}"
          gh api --method POST "${pages_deployment}/cancel"
          for attempt in $(seq 1 12); do
            pages_state=$(gh api "${pages_deployment}" --jq .status)
            echo "Old Pages deployment status: ${pages_state} (attempt ${attempt}/12)."
            case "${pages_state}" in
              in_progress|deploying|building|queued|pending)
                sleep 5
                ;;
              *)
                break
                ;;
            esac
          done
          case "${pages_state}" in
            in_progress|deploying|building|queued|pending)
              echo "::error::The old Pages deployment is still active."
              exit 1
              ;;
          esac

          deployment_ids=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${stale_sha}&environment=github-pages&per_page=100" --jq ".[] | select(.sha == \"\${stale_sha}\" and .environment == \"github-pages\") | .id")
          if [ -z "${deployment_ids}" ]; then
            echo "::error::No matching github-pages deployment record was found for the stale SHA."
            exit 1
          fi

          for deployment_id in ${deployment_ids}; do
            deployment="repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}"
            previous_state=$(gh api "${deployment}/statuses?per_page=1" --jq '.[0].state // "none"')
            echo "Deployment ${deployment_id}: previous state=${previous_state}."
            if [ "${previous_state}" != "inactive" ]; then
              gh api --method POST "${deployment}/statuses" \
                -f state=inactive \
                -f description="Marking an orphaned GitHub Pages deployment inactive during recovery."
            fi
            verified_state=$(gh api "${deployment}/statuses?per_page=1" --jq '.[0].state // "none"')
            if [ "${verified_state}" != "inactive" ]; then
              echo "::error::Deployment ${deployment_id} did not become inactive (state=${verified_state})."
              exit 1
            fi
            gh api --method DELETE "${deployment}"
            echo "Removed inactive orphaned deployment ${deployment_id}."
          done

          echo "Waiting 20 seconds for GitHub Pages to release the stale deployment lock."
          sleep 20
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
